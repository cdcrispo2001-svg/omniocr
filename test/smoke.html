<!doctype html>
<meta charset="utf-8">
<title>OmniOCR smoke</title>
<script>
window.__probe = { status: 'loading', logs: [] };

const GROUND_TRUTH = [
  'The Anatomy of a Scanned Page',
  'Optical character recognition begins long before the recogniser runs.',
  'A page that has been photographed under a desk lamp arrives skewed,',
  'unevenly lit, and speckled with dust from the platen glass.',
  'Restoring geometry and illumination first is what makes the difference',
  'between 62% accuracy and 99% accuracy on the very same document.',
];

function renderPage(degrade) {
  const W = 1240, H = 1754;                     // A4 @ 150 dpi
  const c = new OffscreenCanvas(W, H);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#111';
  x.font = 'bold 44px Georgia, serif';
  x.fillText(GROUND_TRUTH[0], 110, 200);
  x.font = '26px Georgia, serif';
  let y = 300;
  for (let i = 1; i < GROUND_TRUTH.length; i++) { x.fillText(GROUND_TRUTH[i], 110, y); y += 48; }
  if (degrade) {
    // light global blur + a smudge, to prove the restore path does something
    x.filter = 'blur(1.2px)';
    x.drawImage(c, 0, 0);
    x.filter = 'none';
    x.fillStyle = 'rgba(90,70,40,0.35)';
    x.beginPath(); x.ellipse(500, 340, 190, 70, 0.3, 0, Math.PI * 2); x.fill();
  }
  return x.getImageData(0, 0, W, H);
}

const w = new Worker('omni://app/test/smoke-worker.js');
w.onmessage = (e) => {
  const d = e.data;
  if (d.type === 'log') window.__probe.logs.push(d.m);
  else if (d.type === 'done') {
    window.__probe.status = 'ok';
    window.__probe.text = d.text;
    window.__probe.conf = d.conf;
    window.__probe.lines = d.lines;
    window.__probe.truth = GROUND_TRUTH.join('\n');
  } else if (d.type === 'error') {
    window.__probe.status = 'error';
    window.__probe.error = d.error;
  }
};
w.onerror = (e) => { window.__probe = { status: 'error', error: 'worker: ' + e.message, logs: window.__probe.logs }; };
w.postMessage({ imageData: renderPage(true) });
</script>
