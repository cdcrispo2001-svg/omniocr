<script>
console.log('after-script typeof cv='+(typeof cv)+' then='+(typeof cv.then));

let ticks=0; const iv=setInterval(()=>{console.log('tick '+(++ticks)+' '+((performance.now()-t0)/1000).toFixed(1)+'s')},2000);
